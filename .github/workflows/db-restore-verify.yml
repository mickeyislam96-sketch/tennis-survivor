# Quarterly DB-restore verification — closes critical-gap #5.
#
# Daily backups (db-backup.yml) ship pg_dump artifacts to GitHub Actions
# storage. A backup you've never restored isn't a backup. This workflow
# runs quarterly: downloads the most recent successful backup artifact,
# restores it into a fresh Postgres 17 service container, asserts the
# data looks plausible, then tears everything down.
#
# History: 2026-05-08 brief flagged restore-never-tested as critical
# gap #5. Backups had been running daily since session 35 but no one
# had ever proved they were usable.
name: Quarterly DB Restore Verification

on:
  schedule:
    # 04:00 UTC on the 1st of January, April, July, October
    - cron: '0 4 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Specific db-backup run ID to restore (optional — defaults to most recent successful)'
        required: false
        type: string

jobs:
  restore-verify:
    name: Restore latest backup and assert plausibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fsv_restore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

      - name: Find most recent successful db-backup run
        id: find-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
            echo "Using run_id from manual dispatch: $RUN_ID"
          else
            # Most recent successful run of the daily backup workflow
            RUN_ID=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/db-backup.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
            echo "Most recent successful backup run: $RUN_ID"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful db-backup runs found. Cannot verify restore."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Download backup artifact from that run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The backup workflow uploads under a name pattern db-backup-<run_id>.
          ARTIFACT_NAME=$(gh api "repos/${{ github.repository }}/actions/runs/${{ steps.find-run.outputs.run_id }}/artifacts" \
            --jq '.artifacts[0].name')
          echo "Artifact: $ARTIFACT_NAME"

          gh run download ${{ steps.find-run.outputs.run_id }} \
            --repo ${{ github.repository }} \
            --name "$ARTIFACT_NAME" \
            --dir /tmp/restore

          ls -la /tmp/restore/
          BACKUP_FILE=$(ls /tmp/restore/backup_*.sql.gz | head -1)
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
          BACKUP_SIZE=$(stat -c%s "$BACKUP_FILE")
          echo "Backup file size: $BACKUP_SIZE bytes"
          if [ "$BACKUP_SIZE" -lt 1024 ]; then
            echo "::error::Backup file is suspiciously small ($BACKUP_SIZE bytes)."
            exit 1
          fi

      - name: Restore backup into ephemeral Postgres
        env:
          PGPASSWORD: test
        run: |
          echo "Restoring $BACKUP_FILE into ephemeral postgres..."
          gunzip -c "$BACKUP_FILE" | psql \
            -h localhost -p 5432 \
            -U postgres \
            -d fsv_restore_test \
            --set ON_ERROR_STOP=1 \
            -v VERBOSITY=verbose \
            > /tmp/restore.log 2>&1

          # Show the tail of the log either way
          echo "----- restore log tail -----"
          tail -50 /tmp/restore.log
          echo "----- end of restore log -----"

      - name: Assert restored DB is plausible
        env:
          PGPASSWORD: test
        run: |
          set -e
          psql -h localhost -p 5432 -U postgres -d fsv_restore_test \
            -v ON_ERROR_STOP=1 \
            -c "DO \$\$ DECLARE u INT; g INT; m INT; p INT; o INT; missing TEXT; BEGIN SELECT string_agg(t.name, ', ') INTO missing FROM (VALUES ('users'),('groups'),('group_members'),('picks'),('payment_orders'),('admin_audit_log')) AS t(name) WHERE to_regclass('public.' || t.name) IS NULL; IF missing IS NOT NULL THEN RAISE EXCEPTION 'Required tables missing after restore: %', missing; END IF; SELECT COUNT(*) INTO u FROM public.users; SELECT COUNT(*) INTO g FROM public.groups; SELECT COUNT(*) INTO m FROM public.group_members; SELECT COUNT(*) INTO p FROM public.picks; SELECT COUNT(*) INTO o FROM public.picks p WHERE NOT EXISTS (SELECT 1 FROM public.users u WHERE u.id = p.user_id); RAISE NOTICE 'Row counts: users=%, groups=%, group_members=%, picks=%, orphan_picks=%', u, g, m, p, o; IF u < 1 THEN RAISE EXCEPTION 'No users in restored DB - restore probably failed silently'; END IF; IF g < 1 THEN RAISE EXCEPTION 'No groups in restored DB - restore probably failed silently'; END IF; IF o > 0 THEN RAISE EXCEPTION '% orphan picks (no matching user) - referential integrity broken', o; END IF; RAISE NOTICE 'Restore verification passed. Backup is usable.'; END\$\$;"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CRITICAL] Quarterly DB restore verification failed (run ${context.runId})`,
              body: [
                `The quarterly DB-restore drill failed. Fix this BEFORE the next paid event.`,
                ``,
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Source backup run: ${{ steps.find-run.outputs.run_id }}`,
                ``,
                `Critical-gap #5 in \`.claude/memory/project_critical_gaps.md\`. Until this passes, treat backups as unverified.`,
              ].join('\n'),
              labels: ['critical', 'infra'],
            });
